<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; media-src 'none'; worker-src 'none'">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<title>Moto Rush X3</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12141d;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none; }
  #c { display: block; width: 100vw; height: 100vh; }
  #dev { position: fixed; top: 4px; left: 4px; color: #6f6; font: 12px monospace;
    display: none; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; z-index: 10; }
  #dev.performance { top: 82px; left: auto; right: 12px; color: #dff8ff;
    padding: 12px 14px; border: 1px solid rgba(85,216,255,.72); border-radius: 12px;
    background: linear-gradient(145deg, rgba(7,13,20,.94), rgba(13,25,37,.88));
    box-shadow: 0 12px 36px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.06);
    font: 700 11px/1.52 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .15px; text-shadow: none; }
  @media (max-width: 520px) {
    #dev.performance { top: 62px; right: 8px; max-width: calc(100vw - 44px);
      padding: 9px 11px; font-size: 9px; line-height: 1.42; }
  }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd23e; font-weight: 800; letter-spacing: 2px; background: #12141d; z-index: 5; }
  .sr-only { position: fixed !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="application"
  aria-label="Moto Rush X3 motorcycle racing game"></canvas>
<div id="dev"></div>
<div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<section id="semantic-results" class="sr-only" role="dialog" aria-modal="true"
  aria-labelledby="semantic-results-title" hidden>
  <h1 id="semantic-results-title">Run complete</h1>
  <p id="semantic-results-summary"></p>
  <div id="semantic-results-actions"></div>
</section>
<div id="boot" role="status" aria-live="polite">LOADING…</div>
<script src="./version.js"></script>
<script src="./embed.js"></script>
</body>
</html>
