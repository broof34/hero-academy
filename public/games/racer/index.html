<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'"><style>*{box-sizing:border-box}body{margin:0;background:#0d1631;color:white;font:16px system-ui;text-align:center}canvas{display:block;width:100%;max-height:65vh;aspect-ratio:8/5;object-fit:contain;background:radial-gradient(ellipse at top,#253d65,#0d1631);touch-action:none}.controls{display:flex;justify-content:center;gap:12px;padding:12px}button{font:700 17px system-ui;background:#7966ee;color:white;border:0;border-radius:12px;min-height:52px;padding:12px 24px;touch-action:none}button:focus-visible{outline:3px solid #ffda70}p{margin:4px 12px 12px;color:#d0d7ee}small{display:block;padding:8px}</style></head><body><canvas id="canvas" aria-label="Cosmic Rally race track"></canvas><div class="controls"><button disabled data-key="37" aria-label="Steer left">◀</button><button disabled data-key="38" aria-label="Accelerate">Go!</button><button disabled data-key="40" aria-label="Brake">Brake</button><button disabled data-key="39" aria-label="Steer right">▶</button></div><p>Hold Go to accelerate. Steer to stay on the road. Keyboard: arrow keys or WASD.</p><small data-testid="game-status">Ready to race</small><script src="common.js"></script><script src="race.js"></script><script>document.querySelectorAll('button').forEach(b=>b.disabled=false);</script></body></html>
