<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'"><style>*{box-sizing:border-box}body{margin:0;background:#0d1631;color:white;font:16px system-ui;text-align:center}canvas{display:block;width:100%;max-height:65vh;aspect-ratio:8/5;object-fit:contain;background:radial-gradient(ellipse at top,#253d65,#0d1631);touch-action:none}.controls{display:flex;justify-content:center;gap:12px;padding:12px}button{font:700 17px system-ui;background:#7966ee;color:white;border:0;border-radius:12px;min-height:52px;padding:12px 24px;touch-action:none}button:focus-visible{outline:3px solid #ffda70}p{margin:4px 12px 12px;color:#d0d7ee}small{display:block;padding:8px}</style></head><body><canvas id="gameCanvas" width="800" height="500" aria-label="Star Defender game"></canvas><div class="controls"><button disabled data-key="37" aria-label="Move left">◀</button><button disabled data-key="32" aria-label="Start / fire">Start / fire</button><button disabled data-key="39" aria-label="Move right">▶</button></div><p>Move with the arrow keys. Press Space to start and fire. Or use the big buttons!</p><small data-testid="game-status">Ready to defend the stars</small><script src="engine.js"></script><script>
var game=new Game();game.config.gameWidth=650;game.config.gameHeight=350;game.config.bombRate=.025;game.config.invaderRanks=3;game.config.invaderFiles=7;game.config.shipSpeed=210;game.config.rocketVelocity=270;game.initialise(document.querySelector('canvas'));game.start();
function down(k){game.keyDown(k);document.querySelector('small').textContent='Playing · score '+game.score;}
function up(k){game.keyUp(k);}
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down(+b.dataset.key);};b.onclick=()=>{down(+b.dataset.key);up(+b.dataset.key);};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>up(+b.dataset.key);});
onkeydown=e=>{if([32,37,39,80].includes(e.keyCode)){e.preventDefault();down(e.keyCode)}};onkeyup=e=>up(e.keyCode);onblur=()=>{game.pressedKeys={}};onpagehide=()=>game.stop();
document.querySelectorAll('button').forEach(b=>b.disabled=false);</script><script>var academyPaused=false;addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='academy:settings')return;const p=e.data.paused===true;if(p===academyPaused)return;academyPaused=p;if(p){game.stop();game.pressedKeys={}}else game.intervalId=setInterval(()=>GameLoop(game),1000/game.config.fps)});parent.postMessage({type:'academy:ready'},'*');</script></body></html>
